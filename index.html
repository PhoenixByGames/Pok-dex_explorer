<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PokéDex Explorer</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#fff}
body{display:flex;justify-content:center}
#app{position:relative;width:min(520px,100%);height:100dvh;min-height:100vh;padding:18px 14px 20px;background:linear-gradient(160deg,#07152a,#102d43 55%,#06101d);display:flex;flex-direction:column;overflow:hidden}
.brand{text-align:center;color:#62eaff;font-size:10px;font-weight:1000;letter-spacing:3px}
h1{text-align:center;margin:4px 0;font-size:34px}.sub{text-align:center;color:#9eb9c8;font-size:12px}
.search{display:flex;gap:7px;margin:16px 0}.search input{flex:1;min-width:0;padding:13px;border-radius:13px;border:1px solid #315c72;background:#04101b;color:#fff;font-size:16px}
.search button,.back{border:0;border-radius:13px;padding:12px 15px;background:#54eaff;color:#03121a;font-weight:1000}
.status{text-align:center;color:#8da8b7;font-size:12px;min-height:20px}
.dex{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:auto;padding-bottom:20px;flex:1;align-content:start}
.poke{border:1px solid #28516a;border-radius:17px;background:#0b2030;color:#fff;padding:10px;text-align:left}
.poke img{width:100%;height:130px;object-fit:contain;background:#071625;border-radius:13px}
.num{color:#65eaff;font-size:10px;font-weight:900}.pname{text-transform:capitalize;font-weight:1000;font-size:17px}
.detail{margin-top:12px;overflow-y:auto;flex:1;padding-bottom:20px}.hero{display:flex;align-items:center;gap:12px}.hero img{width:150px;height:150px;object-fit:contain;background:#0b2030;border-radius:18px}
.name{font-size:29px;font-weight:1000;text-transform:capitalize}.types{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.type,.chip{padding:6px 9px;border-radius:10px;background:#17364a;font-size:11px;font-weight:900;text-transform:capitalize}.chip{display:inline-block;margin:3px}
.weak .chip{background:#3a2026}.strong .chip{background:#18352b}
.section{margin-top:14px;padding:14px;border:1px solid #28516a;border-radius:17px;background:#071625cc}.section h2{font-size:15px;margin:0 0 9px}
.stats{display:grid;gap:7px}.stat{display:grid;grid-template-columns:78px 1fr 30px;gap:6px;align-items:center;font-size:10px;text-transform:capitalize}
.bar{height:7px;background:#0a1b29;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#54eaff}
.evo{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px}.evo img{width:80px;height:80px;object-fit:contain}
.evo div{text-align:center;font-size:11px;text-transform:capitalize}.arrow{font-size:18px;color:#62eaff}
.back{margin-bottom:10px;background:#10283a;color:#dffaff;border:1px solid #28516a}.load{grid-column:1/-1;text-align:center;color:#7895a5;padding:20px}.loadMoreBtn{width:100%;margin:0;padding:14px}
.fav{width:100%;margin-top:12px;padding:12px;border-radius:12px;border:1px solid #28516a;background:#10283a;color:#fff;font-weight:1000}
.fav.on{background:#59491b}.hidden{display:none}.error{color:#ff9ba5}
#topBar{overflow:hidden;max-height:500px;opacity:1;transition:max-height .16s ease,opacity .14s ease;transform:translateY(0);will-change:max-height,opacity}
#topBar.compact{max-height:0;opacity:0;transform:translateY(-18px);pointer-events:none}
#list{transition:flex .28s ease}

@media(max-width:350px){.poke img{height:110px}.hero img{width:125px;height:125px}.name{font-size:25px}}
.shinyToggleWrap{display:flex;gap:8px;margin:10px 0}.shinyBtn{flex:1}

.movesSection{margin:14px 0;padding:14px;border:1px solid #285a74;border-radius:18px;background:#0b2538}
.sectionTitle{font-weight:950;font-size:18px;color:#dffaff;margin-bottom:10px}
.movesList{display:flex;flex-direction:column;gap:7px;max-height:420px;overflow:auto}
.moveRow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:#102e43;border:1px solid #234f67}
.moveName{font-weight:850;color:#f5fbff;text-transform:capitalize}
.moveMeta{font-size:11px;color:#8fa9b8;text-align:right;white-space:nowrap}
.movesLoading,.movesEmpty{color:#8fa9b8;padding:8px 2px}


/* Small visual polish — card appearance only */
.poke{
  background:linear-gradient(145deg,#102d42,#0a2133);
  border:1px solid #2b607b;
  box-shadow:0 5px 14px rgba(0,0,0,.16);
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}
.poke:active{transform:scale(.985);}


/* Bottom navigation experiment — favourites + regions/filters */
.bottomTools{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(560px,100%);
  z-index:1000;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:rgba(5,18,31,.96);
  border-top:1px solid #285a74;
  backdrop-filter:blur(12px);
}
.bottomTools button{
  min-height:52px;
  border:1px solid #2a5d77;
  border-radius:16px;
  background:#0d2a3f;
  color:#effcff;
  font-weight:950;
  font-size:13px;
}
.bottomTools button:active{transform:scale(.985);}
body{padding-bottom:82px!important;}


/* Bottom-bars refinement: hide the duplicate top Favourites control */
#showFavs{display:none!important;}


/* Bottom navigation refinement: Regions control */
.bottomTools{grid-template-columns:1fr 1fr;}


/* Bottom Regions refinement: remove duplicate top region control */
#regionFilter,.regionFilterWrap{display:none!important;}


/* Favourites view: give the Pokémon more room by hiding the search/header controls */
body.favouritesView .appHeader,
body.favouritesView .search,
body.favouritesView .status{
  display:none!important;
}
body.favouritesView #showAll{
  margin-top:14px!important;
}
body.favouritesView #topBtn{
  bottom:92px!important;
}


/* Favourites view: hide the full top header */
body.favouritesView #topBar,
body.favouritesView #form,
body.favouritesView .search,
body.favouritesView .status,
body.favouritesView #showAll{display:none!important;}
body.favouritesView #detail{margin-top:0!important;padding-top:0!important;}


/* Detail view: keep the top header/search completely out of the way */
body.detailView .appHeader,
body.detailView #form,
body.detailView .search,
body.detailView .status,
body.detailView #showAll{
  display:none!important;
}
body.detailView #detail{
  margin-top:0!important;
  padding-top:10px!important;
}


/* Favourites bottom button intentionally has no count */
#bottomFavCount{display:none!important;}


/* Three-button bottom navigation */
.bottomTools{
  grid-template-columns:1fr 58px 1fr!important;
  align-items:center;
}
.bottomTools #bottomTop{
  width:54px;
  height:54px;
  min-height:54px;
  justify-self:center;
  border-radius:50%;
  padding:0;
  background:#45dff5;
  color:#062033;
  border:0;
  font-size:27px;
  line-height:1;
  font-weight:950;
}


/* Use only the middle bottom Back-to-Top button */
#topBtn{display:none!important;}

/* Only the middle bottom Back-to-Top control is visible */
#topBtn{display:none!important;}
""
.searchFilterBtn{
  min-height:48px;padding:0 14px;border:1px solid #2a5d77;border-radius:14px;
  background:#0d2a3f;color:#effcff;font-weight:950;white-space:nowrap;
}
.filterSheet{display:none;position:fixed;inset:0;z-index:3000;background:rgba(2,12,22,.72);align-items:flex-end;justify-content:center;backdrop-filter:blur(5px)}
.filterSheet.open{display:flex}
.filterPanel{width:min(560px,100%);max-height:82dvh;overflow:auto;background:#0a2134;border:1px solid #285a74;border-radius:24px 24px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.filterTitle{font-size:20px;font-weight:950;color:#effcff;margin:6px 4px 12px}
.filterClose,.filterClear{width:100%;min-height:46px;border:1px solid #2a5d77;border-radius:14px;background:#102e43;color:#effcff;font-weight:900;margin-bottom:9px}
.filterGroup{margin:14px 0}.filterGroup h3{margin:0 0 8px;color:#8fefff;font-size:14px}
.filterChoices{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.filterChoice{min-height:44px;border:1px solid #2a5d77;border-radius:13px;background:#102e43;color:#effcff;font-weight:800;text-transform:capitalize}
.filterChoice.active{background:#45dff5;color:#062033;border-color:#45dff5}

</style>

<body>
<main id="app">
<div id="topBar"><div class="brand">PHOENIX BY GAMES</div>
<h1>POKÉDEX EXPLORER</h1>
<div class="sub">Browse every Pokémon or search by name or number.</div>
<form class="search" id="form"><input id="q" autocomplete="off" placeholder="Search name or number"><button type="button" id="searchFilterBtn" class="searchFilterBtn">⚙️ FILTER</button><button>SEARCH</button></form>
<div class="status" id="status">Loading Pokédex…</div>
<div style="display:flex;gap:8px;margin:8px 0 12px">
<button type="button" class="back" id="showAll" style="flex:1">📖 ALL POKÉMON</button>
<button type="button" class="back" id="showFavs" style="flex:1">⭐ FAVOURITES <span id="favCount">0</span></button>
</div>
<div style="display:flex;gap:8px;margin:0 0 8px">
<select id="regionFilter" aria-label="Filter by region" style="flex:1;padding:12px;border-radius:13px;border:1px solid #28516a;background:#10283a;color:#dffaff;font-weight:900">
<option value="all">🌍 ALL REGIONS</option>
<option value="kanto">KANTO</option><option value="johto">JOHTO</option><option value="hoenn">HOENN</option>
<option value="sinnoh">SINNOH</option><option value="unova">UNOVA</option><option value="kalos">KALOS</option>
<option value="alola">ALOLA</option><option value="galar">GALAR</option><option value="paldea">PALDEA</option>
<option value="other">OTHER / UNKNOWN</option>
</select>
</div>
</div><section id="list" class="dex"></section>
<section id="detail" class="detail hidden"></section>
<button type="button" id="topBtn" aria-label="Back to top" style="
position:fixed !important;right:18px !important;bottom:22px !important;width:54px !important;height:54px !important;border:1px solid #28516a;
border-radius:50%;background:#54eaff;color:#03121a;font-size:24px;font-weight:1000;
box-shadow:0 6px 18px rgba(0,0,0,.35);display:none !important;z-index:99999 !important;pointer-events:auto !important;">↑</button>
</main>
<script>
const API='https://pokeapi.co/api/v2/';
const list=document.getElementById('list'),detail=document.getElementById('detail'),status=document.getElementById('status'),q=document.getElementById('q');
let cache=[],offset=0,loading=false,searchMode=false,showingFavourites=false,selectedId=null,selectedScroll=0;
let favourites=JSON.parse(localStorage.getItem('pokedexFavourites')||'[]').map(Number);
let detailOpen=false;let shinyShowing=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const cap=s=>s.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const regionFilter=document.getElementById('regionFilter');
const regionRanges=[['kanto',1,151],['johto',152,251],['hoenn',252,386],['sinnoh',387,493],['unova',494,649],['kalos',650,721],['alola',722,809],['galar',810,905],['paldea',906,1025]];
function regionForPokemon(p){
 const n=Number((p.species?.url||'').match(/\/(\d+)\/?$/)?.[1]||p.id);
 return regionRanges.find(x=>n>=x[1]&&n<=x[2])?.[0]||'other';
}
function filteredCache(){
 const r=regionFilter.value;
 return r==='all'?cache:cache.filter(p=>regionForPokemon(p)===r);
}

async function get(u){const r=await fetch(API+u);if(!r.ok)throw new Error('request failed');return r.json()}
function img(p,shiny=false){return shiny?(p?.sprites?.other?.['official-artwork']?.front_shiny||p?.sprites?.front_shiny||''):(p?.sprites?.other?.['official-artwork']?.front_default||p?.sprites?.front_default||'')}
function saveFavs(){localStorage.setItem('pokedexFavourites',JSON.stringify(favourites));document.getElementById('favCount').textContent=favourites.length}
function isFav(id){return favourites.includes(Number(id))}
function toggleFav(id){id=Number(id);const i=favourites.indexOf(id);if(i>=0)favourites.splice(i,1);else favourites.push(id);saveFavs();updateFavButton(id)}
function updateFavButton(id){const b=document.getElementById('fav');if(!b)return;b.classList.toggle('on',isFav(id));b.textContent=isFav(id)?'★ FAVOURITED':'☆ FAVOURITE'}
function cardHTML(p){
 return `<button type="button" class="poke" data-id="${p.id}">
   <img loading="lazy" src="${img(p)}" alt="${esc(p.name)}">
   <div class="num">#${String(p.id).padStart(4,'0')}</div>
   <div class="pname">${esc(p.name)}</div>
 </button>`;
}
function bindCards(root=list){
 root.querySelectorAll('.poke:not([data-bound])').forEach(b=>{
   b.dataset.bound='1';
   const id=Number(b.dataset.id);
   const p=cache.find(x=>x.id===id);
   if(p)b.onclick=()=>openPokemon(p);
 });
}
function bindLoadMore(){
 const b=document.querySelector('#more .loadMoreBtn');
 if(b && !b.dataset.bound){b.dataset.bound='1';b.onclick=()=>loadMore();}
}

function renderList(items, preserveScroll=false){
 const oldScroll=preserveScroll?list.scrollTop:0;
 list.innerHTML='';
 detail.classList.add('hidden');
 list.classList.remove('hidden');
 if(!items.length){
   list.innerHTML='<div class="load">⭐ You have no favourites yet.<br>Open a Pokémon and tap Favourite.</div>';
   return;
 }
 items.forEach(p=>list.insertAdjacentHTML('beforeend',cardHTML(p)));
 bindCards();
 if(!searchMode&&!showingFavourites && cache.length<1351){
   const more=document.createElement('div');
   more.className='load'; more.id='more';
   more.textContent='Loading all Pokémon…';
   list.appendChild(more);
 }
 bindLoadMore(); if(preserveScroll) requestAnimationFrame(()=>{list.scrollTop=oldScroll});
}

async function loadMore(){
 if(loading||searchMode||showingFavourites||cache.length>=1351)return;
 loading=true;
 const old=document.getElementById('more');
 if(old)old.remove();
 const marker=document.createElement('div');
 marker.className='load'; marker.id='more';
 marker.textContent='Loading all Pokémon…';
 list.appendChild(marker);
 try{
   // Load the complete set used by this Pokédex. Details are fetched in
   // manageable batches so the browser/API are not flooded.
   const d=await get('pokemon?limit=1351&offset=0');
   cache=[];
   for(let i=0;i<d.results.length;i+=40){
     const chunk=d.results.slice(i,i+40);
     const details=await Promise.all(chunk.map(x=>get('pokemon/'+x.name)));
     cache.push(...details);
     status.textContent=`Loading Pokémon ${cache.length} of ${d.count}…`;
   }
   cache.sort((a,b)=>a.id-b.id);
   offset=cache.length;
   renderList(cache);
   status.textContent=`Showing all ${cache.length} Pokémon`;
 }catch(e){
   marker.textContent='Could not load the full Pokédex. Check your internet connection and try again.';
 }
 loading=false;
}


function capMoveName(s){return String(s||'').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());}
function renderMoves(p){
 const box=document.getElementById('movesList'); if(!box)return;
 const moves=Array.isArray(p?.moves)?p.moves:[];
 if(!moves.length){box.innerHTML='<div class="movesEmpty">No move data available.</div>';return;}
 box.innerHTML=moves.map(m=>{
   const name=capMoveName(m?.move?.name);
   const methods=[...new Set((m?.version_group_details||[]).map(v=>v?.move_learn_method?.name).filter(Boolean))];
   const meta=methods.length?methods.map(capMoveName).join(' • '):'Available';
   return `<div class="moveRow"><span class="moveName">${esc(name)}</span><span class="moveMeta">${esc(meta)}</span></div>`;
 }).join('');
}

async function openPokemon(p){
document.body.classList.add('detailView');
 shinyShowing=false;
 selectedId=p.id;
 selectedScroll=list.scrollTop;
 detailOpen=true;
 topBtn.style.display='none';
 list.classList.add('hidden');
 detail.classList.remove('hidden');
 detail.scrollTop=0;

 // Render the core Pokémon immediately. Optional API data cannot block the page.
 detail.innerHTML=`
 <button type="button" class="back" id="back">← BACK TO POKÉDEX</button>
 <div class="section">
   <div class="hero"><img id="detailSprite" src="${img(p)}" alt="${esc(p.name)}">
   <div><div class="num">#${String(p.id).padStart(4,'0')}</div>
   <div class="name">${esc(p.name)}</div>
   <div class="types">${p.types.map(t=>`<span class="type">${esc(t.type.name)}</span>`).join('')}</div></div></div>
   <button type="button" class="fav ${isFav(p.id)?'on':''}" id="fav">${isFav(p.id)?'★ FAVOURITED':'☆ FAVOURITE'}</button>
 </div>
 <div class="section" id="matchups"><h2>💪 Strengths & weaknesses</h2><div class="load">Loading…</div></div>
 <div class="section" id="evolution"><h2>🔄 Evolution</h2><div class="load">Loading…</div></div>
 <div class="section"><h2>📊 Base stats</h2><div class="shinyToggleWrap"><button type="button" class="back shinyBtn" id="shinyBtn">✨ VIEW SHINY</button></div>
   <div id="movesSection" class="movesSection">
  <div class="sectionTitle">⚔️ MOVES</div>
  <div id="movesList" class="movesList"><div class="movesLoading">Loading moves…</div></div>
</div>
<div class="stats">
 ${p.stats.map(s=>`<div class="stat"><span>${cap(s.stat.name)}</span><div class="bar"><i style="width:${Math.min(100,s.base_stat/2.55)}%"></i></div><b>${s.base_stat}</b></div>`).join('')}
 </div></div>
 <div class="section" id="details"><h2>ℹ️ Details</h2><div class="types">
 <span class="chip">Height ${(p.height/10).toFixed(1)} m</span>
 <span class="chip">Weight ${(p.weight/10).toFixed(1)} kg</span>
 <span class="chip">Loading generation…</span></div></div>`;

 document.getElementById('back').onclick=backToDex;
renderMoves(p);
const shinyBtn=document.getElementById('shinyBtn');
if(shinyBtn){
 shinyBtn.onclick=()=>{
   shinyShowing=!shinyShowing;
   const sprite=document.getElementById('detailSprite');
   if(sprite) sprite.src=img(p,shinyShowing);
   shinyBtn.textContent=shinyShowing?'🔙 VIEW NORMAL':'✨ VIEW SHINY';
 };
}
 document.getElementById('fav').onclick=()=>toggleFav(p.id);

 const safe=async(fn,fallback)=>{try{return await fn()}catch(e){return fallback}};

 // Strengths/weaknesses can load independently.
 const types=(await Promise.all(p.types.map(t=>safe(()=>get('type/'+t.type.name),null)))).filter(Boolean);
 const strong=[...new Set(types.flatMap(t=>t.damage_relations.double_damage_to.map(x=>x.name)))];
 const weak=[...new Set(types.flatMap(t=>t.damage_relations.double_damage_from.map(x=>x.name)))];
 const immune=[...new Set(types.flatMap(t=>t.damage_relations.no_damage_from.map(x=>x.name)))];
 const matchup=document.getElementById('matchups');
 if(matchup) matchup.innerHTML=`<h2>💪 Strong against</h2><div class="strong">${strong.map(x=>`<span class="chip">${esc(x)}</span>`).join('')||'—'}</div><h2>⚠️ Weak against</h2><div class="weak">${weak.map(x=>`<span class="chip">${esc(x)}</span>`).join('')||'—'}</div><h2>🛡️ Immune to</h2><div>${immune.map(x=>`<span class="chip">${esc(x)}</span>`).join('')||'—'}</div>`;

 // Evolution and species are optional and cannot prevent the main page from showing.
 const species=await safe(()=>get('pokemon-species/'+p.id),null);
 const chain=species?.evolution_chain?.url?await safe(()=>get(species.evolution_chain.url.replace(API,'')),null):null;
 let evo=[];
 if(chain?.chain){
   const names=[];
   (function walk(x){if(!x)return;names.push(x.species.name);(x.evolves_to||[]).forEach(walk)})(chain.chain);
   evo=(await Promise.all(names.map(n=>safe(()=>get('pokemon/'+n),null)))).filter(Boolean);
 }
 const evoBox=document.getElementById('evolution');
 if(evoBox) evoBox.innerHTML=`<h2>🔄 Evolution</h2><div class="evo">${evo.length?evo.map((x,i)=>`${i?'<span class="arrow">→</span>':''}<div><img src="${img(x)}" alt="${esc(x.name)}"><br>${esc(x.name)}</div>`).join(''):'<span class="chip">Evolution data unavailable</span>'}</div>`;

 const details=document.getElementById('details');
 if(details) details.innerHTML=`<h2>ℹ️ Details</h2><div class="types"><span class="chip">Height ${(p.height/10).toFixed(1)} m</span><span class="chip">Weight ${(p.weight/10).toFixed(1)} kg</span><span class="chip">${species?.generation?.name?cap(species.generation.name):'—'}</span></div>`;
}

function backToDex(){
document.body.classList.remove('detailView');
  detailOpen=false;
  detail.classList.add('hidden');
  list.classList.remove('hidden');
  searchMode=false;
  showingFavourites=false;
  // The Back to Top control is explicitly restored when returning from details.
  topBtn.style.display='block';
  requestAnimationFrame(()=>{
    list.scrollTop=selectedScroll;
    topBtn.style.display='block';
  });
}
async function showFavourites(){
document.body.classList.remove('detailView');document.body.classList.add('favouritesView');detailOpen=false;showingFavourites=true;searchMode=false;detail.classList.add('hidden');list.classList.remove('hidden');const missing=favourites.filter(id=>!cache.some(p=>p.id===id));if(missing.length){const got=await Promise.all(missing.map(id=>get('pokemon/'+id).catch(()=>null)));cache.push(...got.filter(Boolean))}const items=favourites.map(id=>cache.find(p=>p.id===id)).filter(Boolean);status.textContent=`${items.length} favourite${items.length===1?'':'s'}`;renderList(items)}
regionFilter.onchange=()=>{document.body.classList.remove('detailView');
 detailOpen=false;showingFavourites=false;searchMode=false;q.value='';
 const label=regionFilter.options[regionFilter.selectedIndex].textContent;
 status.textContent=`${label} • ${filteredCache().length} Pokémon`;
 renderList(filteredCache());
};
document.getElementById('showFavs').onclick=showFavourites;document.getElementById('showAll').onclick=()=>{document.body.classList.remove('detailView');document.body.classList.remove('favouritesView');detailOpen=false;showingFavourites=false;searchMode=false;q.value='';regionFilter.value='all';status.textContent=`Showing ${cache.length} loaded Pokémon`;renderList(cache)};
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const raw=q.value.trim().toLowerCase();if(!raw){document.body.classList.remove('favouritesView');showingFavourites=false;searchMode=false;renderList(filteredCache());return}document.body.classList.remove('favouritesView');showingFavourites=false;searchMode=true;status.textContent='Searching…';let found=[];if(/^\d+$/.test(raw)){const n=Number(raw);found=filteredCache().filter(p=>p.id===n);if(!found.length&&n>0&&n<=2000){try{const x=await get('pokemon/'+n);if(regionFilter.value==='all'||regionForPokemon(x)===regionFilter.value)found=[x]}catch{}}}else{found=filteredCache().filter(p=>p.name===raw||p.name.includes(raw));if(!found.length){try{const x=await get('pokemon/'+encodeURIComponent(raw));if(regionFilter.value==='all'||regionForPokemon(x)===regionFilter.value)found=[x]}catch{}}}if(found.length){status.textContent=`Found ${found.length} Pokémon`;renderList(found)}else{list.innerHTML='<div class="load">No Pokémon found.</div>';status.textContent='No match found'}};
window.addEventListener('scroll',()=>{
  if(detailOpen)return;
  if(!searchMode&&!showingFavourites&&window.innerHeight+window.scrollY>=document.body.offsetHeight-700)loadMore();
});


const topBar=document.getElementById('topBar');
let headerCollapsed=false;
function setHeaderCollapsed(collapsed){
  if(detailOpen || headerCollapsed===collapsed)return;
  headerCollapsed=collapsed;
  topBar.classList.toggle('compact',collapsed);
}
list.addEventListener('scroll',()=>{
  if(detailOpen)return;
  const y=list.scrollTop;
  if(y>300) setHeaderCollapsed(true);
  else if(y<220) setHeaderCollapsed(false);
  updateTopButton();
});
const topBtn=document.getElementById('topBtn');
function updateTopButton(){
  topBtn.style.display=detailOpen?'none':'block';
}

topBtn.onclick=()=>{
  topBtn.style.display='block';
  setHeaderCollapsed(false);
  list.scrollTo({top:0,left:0,behavior:'smooth'});
  setTimeout(()=>{
    list.scrollTo({top:0,left:0,behavior:'auto'});
    topBtn.style.display='block';
  },550);
};
list.addEventListener('scroll',updateTopButton,{passive:true});
window.addEventListener('resize',updateTopButton);

saveFavs();loadMore();
</script>

<style>
.regionSheet{display:none;position:fixed;inset:0;z-index:3000;background:rgba(2,12,22,.72);align-items:flex-end;justify-content:center;backdrop-filter:blur(5px)}

.regionSheetInner{width:min(560px,100%);max-height:78dvh;overflow:auto;background:#0a2134;border:1px solid #285a74;border-radius:24px 24px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.35)}

<div id="regionSheet" class="regionSheet" aria-hidden="true">
 <div class="regionSheetInner">
  <button type="button" class="regionClose" id="regionClose">✕ CLOSE</button>
  <div class="regionSheetTitle">🌍 CHOOSE REGION</div>

   <button data-region="all">🌍 ALL REGIONS</button><button data-region="kanto">KANTO</button>
   <button data-region="johto">JOHTO</button><button data-region="hoenn">HOENN</button>
   <button data-region="sinnoh">SINNOH</button><button data-region="unova">UNOVA</button>

   <button data-region="galar">GALAR</button><button data-region="paldea">PALDEA</button>
   <button data-region="other">OTHER / UNKNOWN</button>
  </div>
 </div>

<script>
(function(){
 const fav=document.getElementById('showFavs'), all=document.getElementById('showAll');
 const bottomFav=document.getElementById('bottomFav'), regionBtn=document.getElementById('bottomFilter');
 const sheet=document.getElementById('regionSheet'), close=document.getElementById('regionClose');
 const region=document.getElementById('regionFilter');
 if(bottomFav&&fav) bottomFav.onclick=()=>fav.click();
 const bottomTop=document.getElementById('bottomTop'), top=document.getElementById('topBtn');
 if(bottomTop&&top) bottomTop.onclick=()=>top.click();
 if(regionBtn&&sheet) regionBtn.onclick=()=>sheet.classList.add('open');
 if(close&&sheet) close.onclick=()=>sheet.classList.remove('open');
 if(sheet&&region) sheet.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{
   region.value=b.dataset.region; region.dispatchEvent(new Event('change')); sheet.classList.remove('open');
 });
 if(fav){
   const sync=()=>document.body.classList.toggle('favouritesView',window.showingFavourites===true);
   fav.addEventListener('click',()=>setTimeout(sync,80));
   if(all) all.addEventListener('click',()=>setTimeout(sync,80));
 }
})();
</script>


<div id="filterSheet" class="filterSheet">
 <div class="filterPanel">
  <button type="button" class="filterClose" id="filterClose">✕ CLOSE</button>
  <div class="filterTitle">⚙️ FILTER POKÉMON</div>
  <div class="filterGroup"><h3>TYPE</h3><div class="filterChoices" id="typeChoices"></div></div>
  <div class="filterGroup"><h3>ABILITY</h3><div class="filterChoices" id="abilityChoices"></div></div>
  <div class="filterGroup"><h3>MOVE</h3><div class="filterChoices" id="moveChoices"></div></div>
  <button type="button" class="filterClear" id="filterClear">CLEAR FILTERS</button>
 </div>
</div>


<script>
(function(){
 const btn=document.getElementById('searchFilterBtn'), sheet=document.getElementById('filterSheet');
 if(!btn||!sheet)return;
 const close=document.getElementById('filterClose'), clear=document.getElementById('filterClear');
 const selected={type:'',ability:'',move:''};

 function getData(){
  const names=['allPokemon','pokemon','pokemonData','loadedPokemon','allPokemonData','cache'];
  for(const n of names){try{if(Array.isArray(window[n]))return window[n]}catch(e){}}
  try{for(const k of Object.keys(window)){let v;try{v=window[k]}catch(e){continue}
   if(Array.isArray(v)&&v.length>50&&v.some(x=>x&&x.name&&x.id))return v;}}catch(e){}
  return [];
 }
 function val(x,k){return x?.[k]?.name||x?.name||x}
 function choices(kind){
  const s=new Set();
  getData().forEach(p=>(p[kind==='type'?'types':kind==='ability'?'abilities':'moves']||[]).forEach(x=>s.add(val(x,kind==='type'?'type':kind==='ability'?'ability':'move'))));
  return [...s].filter(Boolean).sort();
 }
 function draw(kind){
  const el=document.getElementById(kind+'Choices'); if(!el)return;
  el.innerHTML=choices(kind).map(v=>'<button type="button" class="filterChoice '+(selected[kind]===v?'active':'')+'" data-kind="'+kind+'" data-value="'+v.replace(/"/g,'&quot;')+'">'+v.replace(/-/g,' ')+'</button>').join('');
 }
 function open(){draw('type');draw('ability');draw('move');sheet.classList.add('open')}
 btn.onclick=open;
 if(close)close.onclick=()=>sheet.classList.remove('open');
 if(clear)clear.onclick=()=>{selected.type='';selected.ability='';selected.move='';draw('type');draw('ability');draw('move');sheet.classList.remove('open')};

 sheet.addEventListener('click',e=>{
  const b=e.target.closest('.filterChoice');if(!b)return;
  const k=b.dataset.kind,v=b.dataset.value;
  selected[k]=selected[k]===v?'':v;
  draw(k);
  // Show the selected filter as the existing search query, which is reliable
  // across the current app's search implementation.
  const input=document.querySelector('input');
  if(input){
    input.value=selected.type||selected.ability||selected.move||'';
    const form=input.closest('form');
    if(form)form.requestSubmit();
  }
 });
})();
</script>
